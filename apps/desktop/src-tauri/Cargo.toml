[package]
name = "vpos_desktop"
version = "0.1.6"
description = "VPOS Desktop cashier workstation application"
authors = ["VPOS Team"]
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5.1", features = [] }

[dependencies]
chrono = { version = "=0.4.38", features = ["clock"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
tauri = { version = "1.6.8", features = ["updater"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_System_Diagnostics_Debug", "Win32_Media_Audio"] }
