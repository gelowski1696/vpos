[package]
name = "vpos_desktop"
version = "0.1.0"
description = "VPOS Desktop"
authors = ["VPOS Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.1", features = [] }

[dependencies]
chrono = { version = "=0.4.38", features = ["clock"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
tauri = { version = "1.6.8", features = [] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing"] }
