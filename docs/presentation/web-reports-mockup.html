<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VPOS Reports Mockup</title>
    <style>
      body {
        margin: 0;
        background: radial-gradient(circle at top right, #1b1b1b 0%, #090909 55%);
        font-family: "Segoe UI", Arial, sans-serif;
        color: #f2f2f2;
      }
      .wrap {
        width: 1366px;
        min-height: 768px;
        margin: 0 auto;
        padding: 34px;
        box-sizing: border-box;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
      }
      .title {
        font-size: 34px;
        font-weight: 700;
      }
      .tag {
        color: #f3c64f;
        letter-spacing: 0.16em;
        font-size: 11px;
        text-transform: uppercase;
      }
      .card {
        border: 1px solid rgba(243, 198, 79, 0.26);
        border-radius: 20px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.03);
      }
      .card img {
        width: 100%;
        border-radius: 12px;
        display: block;
      }
      .note {
        margin-top: 14px;
        color: #c9c9c9;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <h1 class="title">Web Reports Workspace</h1>
        <span class="tag">VMJAMTECH VPOS</span>
      </header>
      <section class="card">
        <img src="../../apps/web/public/illustrations/mockup-reports.svg" alt="Reports Mockup" />
      </section>
      <p class="note">Finance and operations reporting with clearer insight for branch decision-making.</p>
    </main>
  </body>
</html>
